<script>
    const images = document.querySelectorAll('.card img');
    const nameBox = document.getElementById('designName');
    const priceBox = document.getElementById('priceBox');
    const fileInput = document.getElementById('fileInput');
    const hiddenImage = document.getElementById('imageFile');

    images.forEach(img => {
        img.addEventListener('click', () => {

            // remove previous selection
            images.forEach(i => i.classList.remove('selected'));

            // highlight selected image
            img.classList.add('selected');

            // set values
            nameBox.value = img.dataset.name;
            priceBox.value = img.dataset.price;
            hiddenImage.value = img.getAttribute('src');

            // clear file upload
            fileInput.value = "";
        });
    });

    fileInput.addEventListener('change', () => {
        images.forEach(i => i.classList.remove('selected'));

        nameBox.value = "Custom Uploaded File";
        priceBox.value = "Custom Price";
        hiddenImage.value = "User uploaded file";
    });
</script>
